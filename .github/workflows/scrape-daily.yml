name: Daily scrape

on:
  schedule:
    # Every 3 hours from 5:17 AM to 11:17 PM Pacific Standard Time (7 runs a day). GitHub cron is UTC only:
    # 13,16,19,22,01,04,07 UTC = 5,8,11 AM and 2,5,8,11 PM PST. During daylight time (PDT) the runs are 1 hour later.
    - cron: '17 1,4,7,13,16,19,22 * * *'
  workflow_dispatch:
    inputs:
      workers:
        description: 'Number of worker processes for parallel scrape'
        default: '4'
      skip_publish:
        description: 'Skip cache generation publish to Upstash Redis'
        type: boolean
        default: false
      publish_only:
        description: 'Only publish cache generation without scraping'
        type: boolean
        default: false
      recheck_not_found:
        description: 'Recheck not_found companies'
        type: boolean
        default: false
      skip_fixer:
        description: 'Skip automated fixer job'
        type: boolean
        default: false
      fixture_report:
        description: 'Repo path of a v2 report fixture, e.g. backend/tests/fixtures/reports/actionable.json; skips scraping'
        default: ''
      sources:
        description: 'ATS sources to scrape (comma-separated, e.g. ashby,greenhouse,lever; empty uses the GREENHOUSE_ENABLED and LEVER_ENABLED toggles)'
        default: ''
      staged:
        description: 'Run sources one after another (ashby, greenhouse, lever) and publish once; the STAGED_SCRAPE variable turns this on for scheduled runs'
        type: boolean
        default: false
      lever_max_boards:
        description: 'Staged only: Lever board cap (whole number or all); empty uses the code default (3000)'
        default: ''
      lever_stage_min:
        description: 'Staged only: Lever stage length in minutes, 1 to 120; empty uses the code default (70)'
        default: ''
      force_publish:
        description: 'Force cache publish (appends --force to cache:publish in publish_only path)'
        type: boolean
        default: false
      deactivate_source:
        description: 'Emergency rollback: deactivate all jobs for a source and skip scraping'
        type: choice
        options:
          - 'none'
          - 'greenhouse'
          - 'lever'
        default: 'none'
      enrich_backfill:
        description: 'Job attribute backfill: run enrich:jobs --all alone (no scrape, no classify); works with ENRICH_ENABLED off'
        type: boolean
        default: false
      enrich_budget_min:
        description: 'Backfill only: enrichment budget in minutes, 1 to 130 (job timeout is 150)'
        default: '120'

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: scrape-production
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape & Publish
    if: vars.SCRAPE_ENABLED != 'false'
    runs-on: ubuntu-24.04
    # Staged run: about 75-80 min expected, about 132 min worst case (setup 5, company enrichment 8, Ashby 15,
    # Greenhouse 15, Lever 75, classify 2, job attribute enrichment 12). A backfill run (enrich_backfill) is setup 5 +
    # at most 130. Must stay below the 3-hour cron cadence so runs never overlap (docs/deployment-and-operations.md).
    timeout-minutes: 150
    environment: production
    defaults:
      run:
        working-directory: backend
    outputs:
      actionable: ${{ steps.classify.outputs.actionable }}
      run_id: ${{ steps.classify.outputs.run_id }}
      scrape_exit: ${{ steps.scrape.outputs.exit_code }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      TS_NODE_TRANSPILE_ONLY: 'true'
      SCRAPE_TRIGGER: ${{ github.event_name }}
      GIT_SHA: ${{ github.sha }}
      CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SCRAPE_WORKER_TIMEOUT_MS: '900000'
      GH_TOKEN: ${{ github.token }}
      GREENHOUSE_ENABLED: ${{ vars.GREENHOUSE_ENABLED }}
      LEVER_ENABLED: ${{ vars.LEVER_ENABLED }}
      STAGED_SCRAPE: ${{ vars.STAGED_SCRAPE }}
      EFFECTIVE_SOURCES: ${{ inputs.sources != '' && inputs.sources || format('ashby{0}{1}', vars.GREENHOUSE_ENABLED == 'true' && ',greenhouse' || '', vars.LEVER_ENABLED == 'true' && ',lever' || '') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            backend
            scripts/ci

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check scraper
        run: npm run typecheck

      - name: Sync database schema
        run: npx prisma db push --skip-generate

      - name: Backfill multi-source columns
        run: |
          if ! npm run db:backfill-source; then
            echo "⚠️ Backfill failed — G2 must not start; send this log to Claude" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        continue-on-error: true

      - name: Deactivate source (emergency rollback)
        if: inputs.deactivate_source != '' && inputs.deactivate_source != 'none'
        run: npm run source:deactivate -- ${{ inputs.deactivate_source }}

      - name: Restore run history cache
        uses: actions/cache/restore@v6
        with:
          path: backend/output/run-history.json
          key: scrape-history-v2-${{ github.run_id }}
          restore-keys: |
            scrape-history-v2-
            scrape-history-

      - name: Enrich active companies metadata
        if: (inputs.fixture_report == '' || inputs.fixture_report == null) && (inputs.deactivate_source == '' || inputs.deactivate_source == 'none') && inputs.enrich_backfill != true
        run: npm run enrich:companies -- --sources=$EFFECTIVE_SOURCES
        continue-on-error: true

      - name: Run scrape or fixture
        id: scrape
        if: inputs.enrich_backfill != true
        env:
          STAGED_INPUT: ${{ inputs.staged }}
          LEVER_MAX_BOARDS_INPUT: ${{ inputs.lever_max_boards }}
          LEVER_STAGE_MIN_INPUT: ${{ inputs.lever_stage_min }}
        run: |
          set +e
          if [ -n "${{ inputs.deactivate_source }}" ] && [ "${{ inputs.deactivate_source }}" != "none" ]; then
            echo "Source ${{ inputs.deactivate_source }} deactivated; skipping scrape."
          elif [ -n "${{ inputs.fixture_report }}" ]; then
            npm run report:install-fixture -- "${{ inputs.fixture_report }}"; true
          elif [ "${{ inputs.publish_only }}" = "true" ]; then
            PUBLISH_ARGS=""
            [ "${{ inputs.force_publish }}" = "true" ] && PUBLISH_ARGS="--force"
            if [ -n "$PUBLISH_ARGS" ]; then
              npm run cache:publish -- $PUBLISH_ARGS
            else
              npm run cache:publish
            fi
          else
            ARGS="--workers=${{ inputs.workers || '4' }} --sources=$EFFECTIVE_SOURCES"
            if [ "$STAGED_INPUT" = "true" ] || [ "$STAGED_SCRAPE" = "true" ]; then
              ARGS="$ARGS --staged"
              if [ -n "$LEVER_MAX_BOARDS_INPUT" ]; then
                if printf '%s' "$LEVER_MAX_BOARDS_INPUT" | grep -Eq '^([0-9]+|all)$'; then
                  ARGS="$ARGS --lever-max-boards=$LEVER_MAX_BOARDS_INPUT"
                else
                  echo "Invalid lever_max_boards (use digits or all); ignoring it" >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
              if [ -n "$LEVER_STAGE_MIN_INPUT" ]; then
                if printf '%s' "$LEVER_STAGE_MIN_INPUT" | grep -Eq '^[0-9]+$'; then
                  ARGS="$ARGS --lever-stage-min=$LEVER_STAGE_MIN_INPUT"
                else
                  echo "Invalid lever_stage_min (use digits); ignoring it" >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
            fi
            [ "${{ inputs.skip_publish }}" = "true" ] && ARGS="$ARGS --skip-publish"
            [ "${{ inputs.recheck_not_found }}" = "true" ] && ARGS="$ARGS --recheck-not-found"
            npm run scrape:parallel -- $ARGS
          fi
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Classify scrape telemetry
        id: classify
        # A rollback run (deactivate_source) or enrich backfill skips the scrape, so no report exists and classify would exit 1.
        if: always() && (inputs.deactivate_source == '' || inputs.deactivate_source == 'none') && inputs.enrich_backfill != true
        run: npm run report:classify -- --github-output "$GITHUB_OUTPUT" --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Enrich job attributes
        if: >-
          vars.ENRICH_ENABLED == 'true' && inputs.enrich_backfill != true
          && (inputs.fixture_report == '' || inputs.fixture_report == null)
          && (inputs.deactivate_source == '' || inputs.deactivate_source == 'none')
          && inputs.publish_only != true
          && (steps.scrape.outputs.exit_code == '0' || steps.scrape.outputs.exit_code == '2')
        continue-on-error: true
        timeout-minutes: 15
        env:
          GEMINI_MAX_CALLS_VAR: ${{ vars.GEMINI_MAX_CALLS }}
        run: |
          MAX_CALLS=300
          if [ -n "$GEMINI_MAX_CALLS_VAR" ]; then
            if printf '%s' "$GEMINI_MAX_CALLS_VAR" | grep -Eq '^[0-9]+$' && [ "$GEMINI_MAX_CALLS_VAR" -le 100000 ]; then
              MAX_CALLS=$GEMINI_MAX_CALLS_VAR
            else
              echo "Invalid GEMINI_MAX_CALLS (0-100000); using 300" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          npm run enrich:jobs -- --budget-min=10 --model-max-calls=$MAX_CALLS

      - name: Backfill job attributes
        if: inputs.enrich_backfill == true
        env:
          ENRICH_BUDGET_INPUT: ${{ inputs.enrich_budget_min }}
          GEMINI_MAX_CALLS_VAR: ${{ vars.GEMINI_MAX_CALLS }}
        timeout-minutes: 140
        run: |
          if ! printf '%s' "$ENRICH_BUDGET_INPUT" | grep -Eq '^[0-9]+$' || [ "$ENRICH_BUDGET_INPUT" -lt 1 ] || [ "$ENRICH_BUDGET_INPUT" -gt 130 ]; then
            echo "Invalid enrich_budget_min (1-130); using 120" >> "$GITHUB_STEP_SUMMARY"
            ENRICH_BUDGET_INPUT=120
          fi
          MAX_CALLS=300
          if [ -n "$GEMINI_MAX_CALLS_VAR" ]; then
            if printf '%s' "$GEMINI_MAX_CALLS_VAR" | grep -Eq '^[0-9]+$' && [ "$GEMINI_MAX_CALLS_VAR" -le 100000 ]; then
              MAX_CALLS=$GEMINI_MAX_CALLS_VAR
            else
              echo "Invalid GEMINI_MAX_CALLS (0-100000); using 300" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          npm run enrich:jobs -- --all --budget-min=$ENRICH_BUDGET_INPUT --model-max-calls=$MAX_CALLS

      - name: Upload scrape report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scrape-report-${{ steps.classify.outputs.run_id || github.run_id }}
          path: backend/output/reports/**
          retention-days: 30

      - name: Save run history cache (v2)
        uses: actions/cache/save@v6
        if: always()
        with:
          path: backend/output/run-history.json
          key: scrape-history-v2-${{ github.run_id }}

      - name: Save run history cache (legacy dual-save)
        uses: actions/cache/save@v6
        if: always()
        with:
          path: backend/output/run-history.json
          key: scrape-history-${{ github.run_id }}

      - name: Create or update alert issue on failure
        if: steps.scrape.outputs.exit_code == '1' || steps.classify.outputs.infra_alert == 'true'
        run: ../scripts/ci/alert-issue.sh "$CI_RUN_URL" "${{ steps.scrape.outputs.exit_code }}"

      - name: Propagate scraper exit code
        if: steps.scrape.outputs.exit_code == '1'
        run: exit 1

  fixer:
    name: Autonomous Bugfixer
    needs: scrape
    if: always() && needs.scrape.outputs.actionable == 'true' && inputs.skip_fixer != true && vars.FIXER_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: fixer
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix backend ci && npm --prefix frontend ci && npm --prefix backend exec prisma generate

      - name: Download scrape report artifact
        uses: actions/download-artifact@v8
        with:
          name: scrape-report-${{ needs.scrape.outputs.run_id }}
          path: backend/output/reports

      - name: Checkout fix branch
        run: git checkout -b "auto-fix/${{ needs.scrape.outputs.run_id }}"

      - name: Detect fixer secrets
        id: cfg
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HAS_APP: ${{ secrets.FIXER_APP_CLIENT_ID }}
        run: |
          [ -n "$HAS_KEY" ] && echo "has_key=true" >> "$GITHUB_OUTPUT" || echo "has_key=false" >> "$GITHUB_OUTPUT"
          [ -n "$HAS_APP" ] && echo "has_app=true" >> "$GITHUB_OUTPUT" || echo "has_app=false" >> "$GITHUB_OUTPUT"

      - name: Claude fixer
        if: steps.cfg.outputs.has_key == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_BRANCH: auto-fix/${{ needs.scrape.outputs.run_id }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            /fix-from-error-report backend/output/reports/*/${{ needs.scrape.outputs.run_id }}.issues.json (full report: same folder, <runId>.json)
            Do not push. Do not change branches. Stop after at most 3 issues.
          claude_args: |
            --max-turns 60
            --max-budget-usd 5
            --permission-mode dontAsk
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(npm --prefix backend run typecheck),Bash(npm --prefix backend run typecheck:test),Bash(npm --prefix backend run lint),Bash(npm --prefix backend test),Bash(npm --prefix backend test -- *),Bash(npm --prefix frontend run check),Bash(npm --prefix backend run docs:generate),Bash(git status*),Bash(git diff*),Bash(git log*),Bash(git add *),Bash(git commit *)"

      - name: Deterministic gate
        run: scripts/check-all.sh --no-install

      - name: Generate GitHub App token
        if: steps.cfg.outputs.has_app == 'true'
        uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.FIXER_APP_CLIENT_ID }}
          private-key: ${{ secrets.FIXER_APP_PRIVATE_KEY }}

      - name: Push branch and open PR
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: scripts/ci/open-fix-pr.sh "${{ needs.scrape.outputs.run_id }}"

      - name: Record failed fix attempt
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/record-fix-attempt.sh "${{ needs.scrape.outputs.run_id }}"
