# Manual deploys to Vercel. Vercel's own git deploys are off (git.deploymentEnabled: false in both
# vercel.json files), so nothing reaches production until the owner runs this workflow.
# Secrets live in the `vercel-production` GitHub environment. Runbook: docs/deployment-and-operations.md.
name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to deploy (both = backend first, then frontend)'
        type: choice
        options:
          - both
          - frontend
          - backend
        default: both
      target:
        description: 'production updates the live site; preview creates a private test URL'
        type: choice
        options:
          - production
          - preview
        default: production
      ref:
        description: 'Branch, tag or commit SHA to deploy (an older SHA redeploys / rolls back)'
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-vercel
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: '65.1.0'

jobs:
  verify:
    name: Verify (build, lint, typecheck, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout ref to deploy
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Run all checks (installs both apps)
        run: scripts/check-all.sh

  deploy-backend:
    name: Deploy backend (job-scrapper-api)
    needs:
      - verify
    if: inputs.app != 'frontend'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: vercel-production
    env:
      TARGET: ${{ inputs.target }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}
    steps:
      - name: Checkout ref to deploy
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Check deploy secrets are set
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for $name is missing in the vercel-production environment"
              exit 1
            fi
          done

      # Runs from the repo root on purpose: the project's Root Directory (backend) is a Vercel setting,
      # so running inside backend/ would resolve backend/backend.
      - name: Pull Vercel project settings
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      - name: Build
        run: |
          ARGS=()
          if [ "$TARGET" = "production" ]; then ARGS+=(--prod); fi
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build "${ARGS[@]}" --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        run: |
          ARGS=()
          if [ "$TARGET" = "production" ]; then ARGS+=(--prod); fi
          URL="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt "${ARGS[@]}" --token="$VERCEL_TOKEN")"
          echo "Backend $TARGET deployment: $URL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test production backend
        if: inputs.target == 'production'
        run: node scripts/smoke/smoke.mjs https://job-scrapper-api-eight.vercel.app --backend

  deploy-frontend:
    name: Deploy frontend (job-scrapper-ui)
    needs:
      - verify
      - deploy-backend
    # Runs after a successful backend deploy, or alone when only the frontend was requested.
    if: >-
      always() && inputs.app != 'backend' && needs.verify.result == 'success' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: vercel-production
    env:
      TARGET: ${{ inputs.target }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
    steps:
      - name: Checkout ref to deploy
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Check deploy secrets are set
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for $name is missing in the vercel-production environment"
              exit 1
            fi
          done

      # Runs from the repo root on purpose: the project's Root Directory (frontend) is a Vercel setting.
      - name: Pull Vercel project settings
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      - name: Build
        run: |
          ARGS=()
          if [ "$TARGET" = "production" ]; then ARGS+=(--prod); fi
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build "${ARGS[@]}" --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        run: |
          ARGS=()
          if [ "$TARGET" = "production" ]; then ARGS+=(--prod); fi
          URL="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt "${ARGS[@]}" --token="$VERCEL_TOKEN")"
          echo "Frontend $TARGET deployment: $URL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test production site
        if: inputs.target == 'production'
        run: node scripts/smoke/smoke.mjs https://job-scrapper-ui.vercel.app
