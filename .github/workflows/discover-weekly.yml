name: Weekly Discovery

on:
  schedule:
    - cron: '0 4 * * 0' # Weekly Sunday at 04:00 UTC
  workflow_dispatch:
    inputs:
      common_crawl:
        description: 'Query CommonCrawl index in addition to Wayback CDX'
        type: boolean
        default: true
      enrich:
        description: 'Enrich discovered company names & logos'
        type: boolean
        default: true

concurrency:
  group: discovery-pipeline
  cancel-in-progress: false

jobs:
  discover:
    name: Discover & Seed New Companies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TS_NODE_TRANSPILE_ONLY: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run discovery pipeline
        run: |
          ARGS=""
          [ "${{ inputs.common_crawl != false }}" = "true" ] && ARGS="$ARGS --common-crawl"
          [ "${{ inputs.enrich != false }}" = "true" ] && ARGS="$ARGS --enrich"
          npm run discover -- $ARGS

      - name: Run verification auditor
        run: npm run verify
