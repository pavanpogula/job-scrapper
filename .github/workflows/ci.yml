name: CI

on:
  pull_request:
    branches:
      - main
      - 'plan/**'
      - 'auto-fix/**'
  push:
    branches:
      - main
      - 'plan/**'
      - 'auto-fix/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Type-check backend
        run: npm run typecheck
        working-directory: backend

      - name: Type-check tests
        run: npm run typecheck:test
        working-directory: backend

      - name: Lint backend
        run: npm run lint
        working-directory: backend

      - name: Run backend unit and contract tests
        run: npm test
        working-directory: backend

      - name: Check frontend (typecheck, lint, test, build)
        run: npm --prefix frontend run check

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Verify docs generation
        run: npm --prefix backend run docs:check

      - name: Check fixer scope (auto-fix branches)
        if: startsWith(github.head_ref || github.ref_name, 'auto-fix/')
        run: scripts/ci/check-fixer-scope.sh

      - name: Syntax check repo scripts
        run: find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Run repo-level tests
        run: node --test 'scripts/repo-tests/**/*.test.mjs'
