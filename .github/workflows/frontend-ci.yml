name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - 'plan/**'
      - 'auto-fix/**'
  push:
    branches:
      - main
      - 'plan/**'
      - 'auto-fix/**'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for frontend changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "Full run triggered (event: ${{ github.event_name }}, ref: ${{ github.ref_name }})"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            if echo "$CHANGED_FILES" | grep -qE '^frontend/|^\.nvmrc$|^\.github/workflows/frontend-ci\.yml$'; then
              echo "Frontend changes detected in PR"
              echo "frontend=true" >> "$GITHUB_OUTPUT"
            else
              echo "No frontend changes detected in PR"
              echo "frontend=false" >> "$GITHUB_OUTPUT"
            fi
          else
            CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}..HEAD")
            if echo "$CHANGED_FILES" | grep -qE '^frontend/|^\.nvmrc$|^\.github/workflows/frontend-ci\.yml$'; then
              echo "Frontend changes detected in push"
              echo "frontend=true" >> "$GITHUB_OUTPUT"
            else
              echo "No frontend changes detected in push"
              echo "frontend=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  verify:
    name: Frontend Verify & Test
    needs:
      - changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Check frontend (typecheck, lint, test, build)
        run: npm --prefix frontend run check

  frontend-gate:
    name: frontend-gate
    needs:
      - changes
      - verify
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check gate status
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ frontend-gate failed: one or more dependent jobs failed or were cancelled."
            exit 1
          fi
          echo "✅ frontend-gate passed."
